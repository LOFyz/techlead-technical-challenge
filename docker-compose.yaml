version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: wordpress
      POSTGRES_PASSWORD: wordpress
      POSTGRES_DB: wordpress
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - wp_network

  wordpress:
    image: wordpress:php8.2-fpm
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:5432
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('GRAPHQL_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "8080:80"
    volumes:
      - ./docker/wordpress:/var/www/html
      - ./docker/wordpress/plugins:/var/www/html/wp-content/plugins
    networks:
      - wp_network

  migrate:
    build: ./migrator
    restart: "no"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://wordpress:wordpress@db:5432/wordpress
    networks:
      - wp_network

volumes:
  pg_data:

networks:
  wp_network:
    driver: bridge